name: AttendanceWeb API
on:
  push:
    paths: ['attendance_api/**', '.github/workflows/api.yml', 'scripts/composer-audit.sh', 'scripts/test-composer-audit.sh']
  pull_request:
    paths: ['attendance_api/**', '.github/workflows/api.yml', 'scripts/composer-audit.sh', 'scripts/test-composer-audit.sh']
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: attendance_ci_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: attendance_api
    env:
      APP_ENV: testing
      APP_KEY: base64:QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: attendance_ci_test
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, fileinfo, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpunit --log-junit test-results.xml
      - name: Test audit retry and failure handling
        run: bash ../scripts/test-composer-audit.sh
      - name: Audit locked dependencies with bounded network retries
        timeout-minutes: 5
        env:
          COMPOSER_IPRESOLVE: '4'
        run: bash ../scripts/composer-audit.sh
