name: AttendanceWeb React
on:
  push:
    paths: ['atd_react/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['atd_react/**', '.github/workflows/frontend.yml']
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atd_react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: atd_react/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high
